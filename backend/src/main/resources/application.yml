spring:
  application:
    name: FieldAttendanceBackend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:field_attendance}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:super_secret_key_that_should_be_long_and_complex_for_security_purposes_in_production_environment}
  expiration: 86400000 # 1 day in ms
  refresh-expiration: 604800000 # 7 days in ms
